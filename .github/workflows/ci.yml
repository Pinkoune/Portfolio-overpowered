# Chaîne de livraison du PK-01 : vérifications à chaque PR et push, déploiement Pages depuis main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Une PR annule ses anciennes vérifications ; main va toujours au bout (déploiement).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint · types · contenu · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : la salle des machines affiche le tout premier commit du vaisseau.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Validation du contenu
        run: npm run validate:content

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Rapport de taille
        run: |
          {
            echo "### Bundle"
            echo '```'
            du -h dist/assets/*.js dist/assets/*.css | sort -h
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefact Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Déploiement GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
