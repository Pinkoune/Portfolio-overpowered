# Chaîne de livraison du PK-01 : vérifications à chaque PR et push, déploiement Pages depuis main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Une PR annule ses anciennes vérifications ; main va toujours au bout (déploiement).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint · types · contenu · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : la salle des machines affiche le tout premier commit du vaisseau.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Validation du contenu
        run: npm run validate:content

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Budget de taille
        shell: bash
        run: |
          echo "### Budget de taille" >> "$GITHUB_STEP_SUMMARY"
          npm run -s size | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Artefact Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    name: Bout en bout · accessibilité · Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Classique et 3D (WebGL logiciel), sur bureau et mobile, avec audit axe (WCAG 2.1 AA).
      - name: Tests de bout en bout
        run: npm run e2e

      # Le rendu logiciel de la CI donne le mode classique : c'est lui que Lighthouse mesure.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Rapports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rapports-e2e-lighthouse
          path: |
            playwright-report
            test-results
            .lighthouseci
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Déploiement GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
