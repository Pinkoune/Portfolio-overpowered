  fr: >-
    Votre navigateur refuse WebGL, souvent parce que l'accélération matérielle est désactivée
    (Chrome et Edge : Paramètres › Système). Tout le contenu reste disponible ici ; vous pouvez
    réessayer avec « Embarquer en 3D ».
  en: >-
    Your browser refused WebGL, often because hardware acceleration is turned off (Chrome and
    Edge: Settings › System). All the content is still available here; you can try again with
    “Board in 3D”.
