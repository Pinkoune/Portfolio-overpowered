intro:
  fr: >-
    Étudiant en MSc Pro à Epitech Toulouse (diplôme en septembre 2027) et alternant DevOps /
    plateforme chez Capgemini depuis janvier 2025. Je construis des pipelines fiables et, le soir,
    des vaisseaux.
  en: >-
    MSc Pro student at Epitech Toulouse (graduating in September 2027) and DevOps / platform
    apprentice at Capgemini since January 2025. I build reliable pipelines by day and spaceships
    by night.
about:
  - fr: >-
      Je travaille dans une équipe plateforme : migrer des chaînes Jenkins vers GitLab CI, faire
      tourner Kubernetes, décrire l'infrastructure en Terraform et la livrer avec ArgoCD. J'aime
      quand une mise en production devient un non-événement.
    en: >-
      I work in a platform team: migrating Jenkins pipelines to GitLab CI, running Kubernetes,
      describing infrastructure in Terraform and shipping it with ArgoCD. I like it when a
      production release becomes a non-event.
  - fr: >-
      À la maison, un serveur Proxmox me sert de terrain d'essai. En dehors des écrans : basse,
      moto, jeux vidéo, et une fascination tenace pour les trous noirs.
    en: >-
      At home, a Proxmox server is my test bench. Away from screens: bass guitar, motorcycles,
      video games, and a stubborn fascination with black holes.
